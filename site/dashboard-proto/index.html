<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>My Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  /* Set the theme before paint so there is no flash. */
  (function () {
    try {
      var saved = localStorage.getItem("dash-theme");
      var pref = saved || "system";
      var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  })();
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
    <svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#/home" aria-label="Home">
    <span class="mark" id="siteMark">GS</span>
    <span class="name" id="siteName">My Dashboard</span>
  </a>
  <label class="search">
    <svg class="i i-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span class="sr-only">Search</span>
    <input id="search" type="search" placeholder="Search approvals, notes, people">
  </label>
  <span class="spacer"></span>
  <span class="status warn" id="demoBadge" title="Demo mode: config.js has demo: true">Sample data</span>
  <div class="top-actions">
    <button class="icon-btn" id="themeBtn" aria-label="Switch theme">
      <svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
    <a class="icon-btn" href="#/approvals" aria-label="Approvals waiting" id="bellBtn">
      <svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
    </a>
    <span class="avatar" id="topAvatar" aria-hidden="true">GS</span>
  </div>
</header>

<nav class="sidebar" id="sidebar" aria-label="Main">
  <div class="nav" id="nav"></div>
  <div class="side-label">Brands</div>
  <div class="side-brands" id="sideBrands"></div>
  <div class="side-foot">
    <div class="user-card">
      <span class="avatar sm" id="sideAvatar">GS</span>
      <div class="who"><b id="ownerName">Owner</b><span id="ownerRole">Owner</span></div>
    </div>
  </div>
</nav>
<div class="scrim" id="scrim"></div>

<main class="main" id="main" tabindex="-1">
  <div class="page" id="page" aria-live="polite"></div>
</main>

<nav class="bottom-nav" id="bottomNav" aria-label="Quick"></nav>

<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
